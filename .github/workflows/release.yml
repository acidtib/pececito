name: Release

on:
  push:
    branches: [main]
  # Builds the downloads as workflow artifacts without making a release, to test packaging.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.os }})
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p pececito --target ${{ matrix.target }}

      - name: Read the version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"

      # Unpacks to ~/.local/pececito.app; script/install.sh links it into ~/.local.
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          name="pececito.app"
          install -Dm755 "target/${{ matrix.target }}/release/pececito" "$name/bin/pececito"
          install -Dm644 assets/pececito.desktop "$name/share/applications/pececito.desktop"
          install -Dm644 assets/icon/pececito.svg "$name/share/icons/hicolor/scalable/apps/pececito.svg"
          for size in 16 24 32 48 64 128 256 512; do
            install -Dm644 "assets/icon/png/pececito-$size.png" \
              "$name/share/icons/hicolor/${size}x${size}/apps/pececito.png"
          done
          tar -czf pececito-linux-x86_64.tar.gz "$name"
          echo "DOWNLOAD=pececito-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $exe = Resolve-Path "target/${{ matrix.target }}/release/pececito.exe"
          & $iscc "/DVersion=$env:VERSION" "/DExePath=$exe" "/O$PWD" assets/windows/pececito.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DOWNLOAD=Pececito-x86_64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload to the release
        if: env.TAG != ''
        shell: bash
        run: gh release upload "$TAG" "$DOWNLOAD" --clobber

      - name: Upload as a workflow artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DOWNLOAD }}
          path: ${{ env.DOWNLOAD }}
